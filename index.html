<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Dekho K — Watch & Earn</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><div class="brand"><img src="assets/add-dekho-k-logo.png"><div><b>Add Dekho K</b><small>WATCH • EARN • GROW</small></div></div><button class="ghost" id="logoutBtn" hidden>Logout</button></header>
<main><section id="authView" class="auth card"><div class="hero-mini"><img class="auth-logo" src="assets/add-dekho-k-logo.png"><h1>Watch. Earn. Withdraw.</h1><p>One platform for advertisers and ad viewers.</p></div><div class="tabs"><button class="tab active" data-mode="login">Login</button><button class="tab" data-mode="register">Register</button></div>
<form id="authForm"><div id="regFields" hidden><input id="name" placeholder="Full name"><select id="role"><option value="viewer">I want to watch ads & earn</option><option value="client">I am an advertiser / client</option></select><input id="parentId" placeholder="Parent ID (optional)"></div><input id="loginId" placeholder="ID or Email" required><input id="password" type="password" placeholder="Password" required><button class="primary" id="authSubmit">Login</button></form><p id="authMsg" class="note"></p><p class="note">Viewer IDs and Client IDs are separate. Admin has a separate secure dashboard.</p></section>
<section id="appView" hidden><div class="welcome"><div><p class="eyebrow" id="roleLabel">DASHBOARD</p><h1>Welcome, <span id="userName"></span></h1><p class="muted" id="userMeta"></p></div><div class="balance"><span id="balanceLabel">Total Earning</span><strong>₹<span id="balance">0</span></strong><small id="balanceSub">Available demo balance</small></div></div><div id="stats" class="grid stats"></div><div id="nav" class="navgrid"></div><div id="pageArea"></div></section></main>
<div class="modal" id="modal" hidden><div class="modalbox"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><script src="app.js"></script></body></html>
